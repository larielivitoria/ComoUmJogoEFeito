function fundo(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#120838'); g.addColorStop(.55,'#241653'); g.addColorStop(1,'#140d33');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=.10; ctx.fillStyle='#fff';
  for(let i=0;i<60;i++){ const x=(i*263+Math.sin(i)*40)%W, y=(i*137+Math.cos(i*2)*30)%H; circ(x,y,1.6); }
  ctx.restore();
}
function cartao(x,y,w,h){
  ctx.fillStyle='rgba(12,7,32,.72)'; rr(x,y,w,h,24); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.stroke();
}
function marca(){
  if(logoImg&&logoImg.naturalWidth){
    const k=170/logoImg.naturalWidth, w=170, h=logoImg.naturalHeight*k;
    ctx.drawImage(logoImg, 60, 38, w, h);
    txt('Ciência da Computação (Jundiaí)', 60, 38+h+18, 20, '#c3b6ff', 'left', 700);
  }
}
function rodape(){
  const s=SLIDES[slide];
  if(notas && s.nota){
    const ls=quebra(s.nota, 23, W-470);
    const alt=Math.max(58, 26+ls.length*30);
    ctx.fillStyle='rgba(10,6,28,.92)'; rr(60,H-62-alt,W-120,alt,16); ctx.fill();
    ctx.strokeStyle='rgba(255,210,63,.35)'; ctx.lineWidth=2; ctx.stroke();
    txt('ROTEIRO DO MONITOR', 84, H-62-alt/2, 18, '#ffd23f', 'left', 800);
    ls.forEach((ln,i)=> txt(ln, 340, H-62-alt/2 - (ls.length-1)*15 + i*30, 23, '#e8e2ff', 'left', 700));
  }
  for(let i=0;i<SLIDES.length;i++){
    ctx.fillStyle = i===slide? '#ffd23f' : 'rgba(255,255,255,.22)';
    circ(W/2-(SLIDES.length-1)*13+i*26, H-26, i===slide?7:5);
  }
  ctx.save(); ctx.globalAlpha=.5+.5*Math.abs(Math.sin(T*2.4));
  txt('clique para avançar', W-70, H-26, 22, '#7ff9ff', 'right', 700); ctx.restore();

  ctx.font=`700 ${tam}px 'Baloo 2', system-ui, sans-serif`;
  const palavras=texto.split(' '), linhas=[]; let l='';
  for(const p of palavras){
    const teste = l? l+' '+p : p;
    if(ctx.measureText(teste).width>largMax && l){ linhas.push(l); l=p; } else l=teste;
  }
  if(l) linhas.push(l); return linhas;
}

/* ---------------- bonequinho articulado (slide 7) ---------------- */
function boneco(cx,cy,p,cor,alpha){
  const v=(a,l)=>({x:Math.sin(a)*l, y:Math.cos(a)*l});
  const add=(A,B)=>({x:A.x+B.x,y:A.y+B.y});
  const q={x:cx,y:cy};
  const pes=add(q,v(Math.PI-p.lean,86));
  const cab=add(pes,v(Math.PI-p.lean,34));
  const coF=add(pes,v(p.aFa,58)), maF=add(coF,v(p.aFb,52));
  const coB=add(pes,v(p.aBa,58)), maB=add(coB,v(p.aBb,52));
  const joF=add(q,v(p.lFa,64)), peF=add(joF,v(p.lFb,58));
  const joB=add(q,v(p.lBa,64)), peB=add(joB,v(p.lBb,58));
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.strokeStyle=cor; ctx.lineWidth=13; ctx.lineCap='round'; ctx.lineJoin='round';
  const linha=(a,b)=>{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();};
  linha(q,pes); linha(pes,coB); linha(coB,maB); linha(q,joB); linha(joB,peB);
  linha(pes,coF); linha(coF,maF); linha(q,joF); linha(joF,peF);
  ctx.fillStyle=cor; circ(cab.x,cab.y,20);
  ctx.restore();
}
const POSE_A={lean:.16,aFa:.62,aFb:2.30,aBa:.42,aBb:2.42,lFa:.34,lFb:.16,lBa:-.30,lBb:-.52};
const POSE_B={lean:.30,aFa:1.52,aFb:1.54,aBa:.60,aBb:2.50,lFa:.52,lFb:.28,lBa:-.42,lBb:-.72};
const misturaPose=(a,b,u)=>{const o={};for(const k in a)o[k]=lerp(a[k],b[k],u);return o;};

function animCapa(t){

  const x=P.x+120+((t*110)%(P.w-240));
  const pulo=Math.abs(Math.sin(t*3))*46;
  boneco(x, chao-pulo, misturaPose(POSE_A,POSE_B,(Math.sin(t*3)+1)/2), '#7ff9ff');
  for(let i=0;i<3;i++){
    const ix=P.x+180+i*210, iy=P.y+90+((t*120+i*90)%(chao-P.y-110));
    ctx.fillStyle='#ffd23f'; circ(ix,iy,16);
    txt(['1','0','1'][i], ix, iy+1, 20, '#3b1a80', 'center', 800);

function animFerramentas(t){

function animConvite(t){
  const P=PAINEL;
  const lado=290;
  const cx=P.x+P.w-250, cy=P.y+250;
  const plate=lado+46;
  ctx.fillStyle='#fff'; rr(cx-plate/2,cy-plate/2,plate,plate,20); ctx.fill();
  const n=QR.length, m=lado/n, x0=cx-lado/2, y0=cy-lado/2;
  ctx.fillStyle='#12082c';
  for(let i=0;i<n;i++){ const L=QR[i];
    for(let j=0;j<n;j++) if(L[j]==='1') ctx.fillRect(Math.floor(x0+j*m),Math.floor(y0+i*m),Math.ceil(m),Math.ceil(m)); }
  txt(SITE, cx, cy+plate/2+40, 28, '#ffd23f', 'center', 800);
  const chao=P.y+P.h-60;
  boneco(P.x+180, chao, misturaPose(POSE_A,POSE_B,(Math.sin(t*2.4)+1)/2), '#7ff9ff');
}

/* ---------------- slides ---------------- */
const SLIDES=[
 { titulo:'Como um jogo é feito?', sub:'Cinco minutos, sem enrolação',

 { titulo:'Quer fazer o seu?', sub:'Oficina no laboratório: 30 minutos',

/* ---------------- navegação ---------------- */
let ocioso=0;
function irPara(n){
  ocioso=0;
  const novo=clamp(n,0,SLIDES.length-1);
  if(novo!==slide){ slide=novo; st=0; }
}
addEventListener('keydown', e=>{
  const k=e.key.toUpperCase();
  if(['W','A','S','D'].includes(k)) teclas[k]=true;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='PageDown'){ e.preventDefault(); irPara(slide+1); }
  if(e.code==='ArrowLeft'||e.code==='Backspace'||e.code==='PageUp'){ e.preventDefault(); irPara(slide-1); }
  if(e.code==='Home'){ irPara(0); }
  if(e.code==='KeyN'){ notas=!notas; }
  if(e.code==='KeyF'){ try{ if(!document.fullscreenElement){const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(r&&r.catch) r.catch(()=>{});} else document.exitFullscreen(); }catch(err){} }
});
addEventListener('keyup', e=>{ const k=e.key.toUpperCase(); if(['W','A','S','D'].includes(k)) teclas[k]=false; });
addEventListener('blur', ()=>{ for(const k in teclas) teclas[k]=false; });
cv.addEventListener('pointermove', e=>{ const r=cv.getBoundingClientRect(); mouse.x=(e.clientX-r.left)/r.width*W; mouse.y=(e.clientY-r.top)/r.height*H; });
cv.addEventListener('pointerdown', e=>{ cv.focus(); if(e.button===2) irPara(slide-1); else irPara(slide+1); });
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); });

/* ---------------- loop ---------------- */
let ultimo=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-ultimo)/1000)); ultimo=now; T+=dt; st+=dt;
  ocioso+=dt; if(ocioso>120 && slide!==0){ slide=0; st=0; ocioso=0; }
  const s=SLIDES[slide];
  fundo(); marca();
  cartao(PAINEL.x-10,PAINEL.y-10,PAINEL.w+20,PAINEL.h+20);
  ctx.save(); ctx.beginPath(); rr(PAINEL.x-10,PAINEL.y-10,PAINEL.w+20,PAINEL.h+20,24); ctx.clip();
  s.anim(st); ctx.restore();
  titulo(s);
  rodape();
  const ent=clamp(st/.45,0,1);
  if(ent<1){ ctx.save(); ctx.globalAlpha=(1-ent)*.9; ctx.fillStyle='#140a3a'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
})();
